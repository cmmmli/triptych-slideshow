<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 画像はローカルで読むだけなので、外部への通信と外部リソースの読み込みを一切禁止する -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>Triptych Slideshow</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }

  #start {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    text-align: center; padding: 16px;
  }
  #start.hidden { display: none; }
  #start.drag { outline: 3px dashed #777; outline-offset: -24px; }
  #start h1 { margin: 0; font-weight: 600; letter-spacing: .02em; }
  #start p { margin: 0; color: #aaa; }
  .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
    background: #2f6fed; color: #fff; font: inherit; font-size: 15px;
  }
  .btn.secondary { background: #333; }
  .hint { font-size: 13px; }

  #stage { position: fixed; inset: 0; display: flex; }
  #stage.gap { gap: 4px; }
  .slot { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; cursor: pointer; }
  .slot img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity .6s ease;
  }
  #stage.cover .slot img { object-fit: cover; }
  .slot img.show { opacity: 1; }
  .cap {
    position: absolute; left: 8px; right: 8px; bottom: 8px; display: none;
    font-size: 12px; color: #ddd; text-shadow: 0 1px 3px #000;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #stage.info .cap { display: block; }

  body.idle, body.idle .slot { cursor: none; }

  #toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 3;
    background: rgba(20,20,20,.85); padding: 8px 16px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  #help {
    position: fixed; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.8); padding: 16px;
  }
  #help.show { display: flex; }
  #help table { border-collapse: collapse; font-size: 14px; }
  #help td { padding: 4px 12px; }
  #help td:first-child { text-align: right; }
  kbd {
    display: inline-block; min-width: 1.4em; padding: 1px 6px; border-radius: 4px;
    background: #333; border: 1px solid #555; font-family: ui-monospace, monospace; text-align: center;
  }
</style>
</head>
<body>
<div id="start">
  <h1>Triptych Slideshow</h1>
  <p>画像フォルダをここにドロップするか、選択してください</p>
  <div class="buttons">
    <button type="button" class="btn" id="lastButton" hidden>前回のフォルダ「<span id="lastName"></span>」を開く</button>
    <button type="button" class="btn" id="dirButton">フォルダを選択</button>
    <button type="button" class="btn secondary" id="fileButton">ファイルを選択</button>
  </div>
  <input type="file" id="dirInput" webkitdirectory multiple hidden>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <p class="hint"><kbd>H</kbd> でキー操作一覧</p>
</div>
<div id="stage"></div>
<div id="toast"></div>
<div id="help">
  <table>
    <tr><td><kbd>Space</kbd></td><td>再生 / 一時停止</td></tr>
    <tr><td><kbd>→</kbd> <kbd>←</kbd></td><td>次へ / 前へ（履歴）</td></tr>
    <tr><td>クリック</td><td>その枠だけ入れ替え</td></tr>
    <tr><td><kbd>1</kbd> <kbd>3</kbd></td><td>1枚表示 / 3枚横並び</td></tr>
    <tr><td><kbd>C</kbd></td><td>入れ替え方：1枚ずつ順番 → 1枚ずつランダム → 全部</td></tr>
    <tr><td><kbd>S</kbd></td><td>シャッフル ON / OFF</td></tr>
    <tr><td><kbd>Z</kbd></td><td>全体表示 / 埋める（トリミング）</td></tr>
    <tr><td><kbd>P</kbd></td><td>3枚モードで縦長画像のみ ON / OFF</td></tr>
    <tr><td><kbd>+</kbd> <kbd>-</kbd></td><td>表示間隔を変更</td></tr>
    <tr><td><kbd>G</kbd></td><td>枠の隙間 ON / OFF</td></tr>
    <tr><td><kbd>I</kbd></td><td>ファイル名表示</td></tr>
    <tr><td><kbd>F</kbd></td><td>フルスクリーン</td></tr>
    <tr><td><kbd>O</kbd></td><td>別のフォルダを開く</td></tr>
    <tr><td><kbd>Esc</kbd></td><td>最初の画面に戻る</td></tr>
    <tr><td><kbd>H</kbd></td><td>このヘルプ</td></tr>
  </table>
</div>

<script>
const IMG_RE = /\.(jpe?g|png|gif|webp|avif|heic|heif|bmp|tiff?)$/i;
const INTERVALS = [1, 2, 3, 5, 8, 10, 15, 20, 30, 60, 120];
const CHANGE_LABELS = { seq: '1枚ずつ順番', rand: '1枚ずつランダム', all: '全部まとめて' };
const HISTORY_LIMIT = 300;

const defaults = {
  mode: 3, change: 'seq', shuffle: true, fit: 'contain',
  portraitOnly: true, interval: 5, gap: false, info: false,
};
const settings = { ...defaults };
try { Object.assign(settings, JSON.parse(localStorage.getItem('triptych-settings') || '{}')); } catch {}
function saveSettings() {
  try { localStorage.setItem('triptych-settings', JSON.stringify(settings)); } catch {}
}

const $ = (id) => document.getElementById(id);
const stage = $('stage');

let files = [];       // { name, url, w, h, bad }
let bag = [];         // 次に出す候補（末尾から pop）
let slots = [];       // { el, imgs, front, cur, token, cap }
let history = [];     // 各スロットの画像 index の配列
let histPos = -1;
let playing = true;
let timer = null;
let seqSlot = 0;
let busy = false;

// ---------- 画像の読み込み ----------

// list: { file: File, name: 表示用のパス }[]
function setFiles(list) {
  const images = list.filter(({ file }) => file.type.startsWith('image/') || IMG_RE.test(file.name));
  if (!images.length) { toast('画像が見つかりませんでした'); return false; }
  for (const f of files) URL.revokeObjectURL(f.url);
  files = images.map(({ file, name }) => ({ name, url: URL.createObjectURL(file) }));
  bag = [];
  seqSlot = 0;
  $('start').classList.add('hidden');
  rebuild([]);
  toast(`${files.length} 枚の画像を読み込みました`);
  return true;
}

// ---------- 前回のフォルダ（File System Access API、Chrome / Edge のみ） ----------

const supportsHandles = 'showDirectoryPicker' in window;
let lastDir = null;

// フォルダのハンドルは localStorage に入らないので IndexedDB に保存する
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('triptych', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const db = open.result;
      const tx = db.transaction('kv', mode);
      const req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => { db.close(); resolve(req.result); };
      tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
    };
  });
}

function showLastDir(dir) {
  lastDir = dir;
  $('lastName').textContent = dir.name;
  $('lastButton').hidden = false;
  $('dirButton').classList.add('secondary');
}

async function readDirHandle(dir, prefix, out) {
  for await (const h of dir.values()) {
    if (h.name.startsWith('.')) continue;
    const path = `${prefix}/${h.name}`;
    if (h.kind === 'directory') await readDirHandle(h, path, out);
    else if (IMG_RE.test(h.name)) out.push({ file: await h.getFile(), name: path });
  }
}

async function openDirHandle(dir) {
  const out = [];
  try {
    await readDirHandle(dir, dir.name, out);
  } catch {
    toast('フォルダを読み込めませんでした（移動・削除された可能性があります）');
    return;
  }
  if (!setFiles(out)) return;
  showLastDir(dir);
  idb('readwrite', (s) => s.put(dir, 'lastDir')).catch(() => {});
}

async function openFolder() {
  if (!supportsHandles) { $('dirInput').click(); return; }
  let dir;
  try {
    dir = await window.showDirectoryPicker({ id: 'triptych', mode: 'read' });
  } catch (e) {
    if (e.name !== 'AbortError') toast('フォルダを開けませんでした');
    return;
  }
  await openDirHandle(dir);
}

async function openLastDir() {
  if (!lastDir) return;
  // 許可はページを開き直すと切れることが多いので、クリック（ユーザー操作）の中で取り直す
  let perm;
  try {
    perm = await lastDir.queryPermission({ mode: 'read' });
    if (perm !== 'granted') perm = await lastDir.requestPermission({ mode: 'read' });
  } catch {
    toast('前回のフォルダを開けませんでした');
    return;
  }
  if (perm !== 'granted') { toast('フォルダへのアクセスが許可されませんでした'); return; }
  await openDirHandle(lastDir);
}

if (supportsHandles) {
  idb('readonly', (s) => s.get('lastDir')).then((dir) => dir && showLastDir(dir)).catch(() => {});
}

$('lastButton').addEventListener('click', openLastDir);
$('dirButton').addEventListener('click', openFolder);
$('fileButton').addEventListener('click', () => $('fileInput').click());
for (const id of ['dirInput', 'fileInput']) {
  $(id).addEventListener('change', (e) => {
    setFiles([...e.target.files].map((file) => ({ file, name: file.webkitRelativePath || file.name })));
    e.target.value = ''; // 同じフォルダを選び直しても change が発火するように
  });
}

async function readEntry(entry, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ file, name: entry.fullPath.replace(/^\//, '') });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) await readEntry(child, out);
    }
  }
}

document.addEventListener('dragover', (e) => { e.preventDefault(); $('start').classList.add('drag'); });
document.addEventListener('dragleave', () => $('start').classList.remove('drag'));
document.addEventListener('drop', async (e) => {
  e.preventDefault();
  $('start').classList.remove('drag');
  // DataTransfer の中身は drop イベント中に同期的に取り出さないと、await の後では空になる
  const items = [...e.dataTransfer.items].filter((it) => it.kind === 'file');
  const handles = items.map((it) => it.getAsFileSystemHandle?.());
  const entries = items.map((it) => it.webkitGetAsEntry?.()).filter(Boolean);
  const dropped = [...e.dataTransfer.files];

  // フォルダを1つだけドロップした場合は、ハンドルとして開いて「前回のフォルダ」にする
  if (handles.length === 1 && handles[0]) {
    const h = await handles[0].catch(() => null);
    if (h?.kind === 'directory') { await openDirHandle(h); return; }
  }
  const out = [];
  if (entries.length) {
    for (const entry of entries) await readEntry(entry, out);
  } else {
    out.push(...dropped.map((file) => ({ file, name: file.name })));
  }
  setFiles(out);
});

// ---------- 画像の選び方 ----------

function refillBag() {
  const idx = files.map((_, i) => i);
  if (settings.shuffle) {
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
  } else {
    idx.reverse();
  }
  bag = idx;
}

function draw(exclude) {
  const usable = files.filter((f) => !f.bad).length;
  for (let t = 0; t < files.length * 2 + 2; t++) {
    if (!bag.length) refillBag();
    const i = bag.pop();
    if (files[i].bad) continue;
    if (exclude.has(i) && usable > exclude.size) { bag.unshift(i); continue; }
    return i;
  }
  return Math.floor(Math.random() * files.length);
}

function probe(i) {
  const f = files[i];
  if (f.w !== undefined || f.bad) return Promise.resolve(f);
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => { f.w = img.naturalWidth; f.h = img.naturalHeight; res(f); };
    img.onerror = () => { f.bad = true; res(f); };
    img.src = f.url;
  });
}

async function pick(exclude) {
  const wantPortrait = settings.mode === 3 && settings.portraitOnly;
  for (let t = 0; t < 60; t++) {
    if (!files.length) return -1; // 読み込み中に最初の画面へ戻った
    const i = draw(exclude);
    const f = await probe(i);
    if (f.bad) continue;
    if (!wantPortrait || f.h > f.w) return i;
  }
  return files.length ? draw(exclude) : -1; // 縦長画像が見つからない場合は妥協する
}

// ---------- 表示 ----------

function rebuild(keep) {
  stage.innerHTML = '';
  slots = [];
  for (let k = 0; k < settings.mode; k++) {
    const el = document.createElement('div');
    el.className = 'slot';
    const imgs = [new Image(), new Image()];
    const cap = document.createElement('div');
    cap.className = 'cap';
    el.append(...imgs, cap);
    const slot = { el, imgs, front: 0, cur: -1, token: 0, cap };
    el.addEventListener('click', () => replaceSlot(k));
    stage.append(el);
    slots.push(slot);
  }
  applyClasses();
  history = [];
  histPos = -1;
  (async () => {
    const state = [];
    const exclude = new Set();
    for (let k = 0; k < slots.length; k++) {
      const i = keep[k] !== undefined && keep[k] >= 0 ? keep[k] : await pick(exclude);
      state.push(i);
      exclude.add(i);
    }
    pushHistory(state);
    await applyState(state);
    schedule();
  })();
}

function applyClasses() {
  stage.classList.toggle('cover', settings.fit === 'cover');
  stage.classList.toggle('gap', settings.gap);
  stage.classList.toggle('info', settings.info);
}

async function showIn(slot, i) {
  const token = ++slot.token;
  const back = slot.imgs[1 - slot.front];
  back.src = files[i].url;
  try { await back.decode(); } catch {}
  if (token !== slot.token) return;
  back.classList.add('show');
  slot.imgs[slot.front].classList.remove('show');
  slot.front = 1 - slot.front;
  slot.cur = i;
  slot.cap.textContent = files[i].name;
}

function applyState(state) {
  if (state.length !== slots.length || state.some((i) => !files[i])) return; // 途中で戻った・読み直した
  return Promise.all(slots.map((s, k) => (s.cur !== state[k] ? showIn(s, state[k]) : null)));
}

function pushHistory(state) {
  if (state.length !== slots.length || state.some((i) => !files[i])) return;
  history = history.slice(0, histPos + 1);
  history.push(state);
  if (history.length > HISTORY_LIMIT) history.shift();
  histPos = history.length - 1;
}

async function step(dir) {
  if (busy || !slots.length) return;
  busy = true;
  try {
    if (dir < 0) {
      if (histPos > 0) await applyState(history[--histPos]);
      else toast('これより前の履歴はありません');
      return;
    }
    if (histPos < history.length - 1) {
      await applyState(history[++histPos]);
      return;
    }
    const cur = history[histPos] || slots.map((s) => s.cur);
    const next = cur.slice();
    const n = slots.length;
    let targets;
    if (n === 1 || settings.change === 'all') targets = [...Array(n).keys()];
    else if (settings.change === 'seq') { targets = [seqSlot % n]; seqSlot = (seqSlot + 1) % n; }
    else targets = [Math.floor(Math.random() * n)];
    const exclude = new Set(cur);
    for (const t of targets) {
      const i = await pick(exclude);
      next[t] = i;
      exclude.add(i);
    }
    pushHistory(next);
    await applyState(next);
  } finally {
    busy = false;
  }
}

async function replaceSlot(k) {
  if (busy || histPos < 0) return;
  busy = true;
  try {
    const cur = history[histPos].slice();
    cur[k] = await pick(new Set(cur));
    pushHistory(cur);
    await applyState(cur);
  } finally {
    busy = false;
  }
  schedule();
}

function schedule() {
  clearTimeout(timer);
  if (!playing || !files.length) return;
  timer = setTimeout(async () => { await step(1); schedule(); }, settings.interval * 1000);
}

// ---------- UI ----------

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

let idleTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2000);
});

function backToStart() {
  if (!files.length) return;
  clearTimeout(timer);
  for (const s of slots) s.token++; // 読み込み中の画像を捨てる
  for (const f of files) URL.revokeObjectURL(f.url);
  files = [];
  bag = [];
  slots = [];
  history = [];
  histPos = -1;
  stage.innerHTML = '';
  $('start').classList.remove('hidden');
}

function setMode(m) {
  if (settings.mode === m) return;
  settings.mode = m;
  saveSettings();
  if (!files.length) { toast(m === 3 ? '3枚横並び' : '1枚表示'); return; }
  const keep = slots.map((s) => s.cur);
  // 1枚 → 3枚 のときは今の画像を中央に置く
  rebuild(m === 3 && keep.length === 1 ? [undefined, keep[0], undefined] : keep);
  toast(m === 3 ? '3枚横並び' : '1枚表示');
}

function changeInterval(d) {
  const pos = INTERVALS.findIndex((v) => v >= settings.interval);
  const base = pos < 0 ? INTERVALS.length - 1 : pos;
  settings.interval = INTERVALS[Math.min(INTERVALS.length - 1, Math.max(0, base + d))];
  saveSettings();
  schedule();
  toast(`表示間隔 ${settings.interval} 秒`);
}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const help = $('help');
  switch (e.key) {
    case ' ':
      e.preventDefault();
      playing = !playing;
      schedule();
      toast(playing ? '▶ 再生' : '⏸ 一時停止');
      break;
    case 'ArrowRight': step(1).then(schedule); break;
    case 'ArrowLeft': step(-1).then(schedule); break;
    case '1': setMode(1); break;
    case '3': setMode(3); break;
    case 'c': case 'C': {
      const order = ['seq', 'rand', 'all'];
      settings.change = order[(order.indexOf(settings.change) + 1) % order.length];
      saveSettings();
      toast(`入れ替え方：${CHANGE_LABELS[settings.change]}`);
      break;
    }
    case 's': case 'S':
      settings.shuffle = !settings.shuffle;
      saveSettings();
      bag = [];
      toast(`シャッフル ${settings.shuffle ? 'ON' : 'OFF'}`);
      break;
    case 'z': case 'Z':
      settings.fit = settings.fit === 'contain' ? 'cover' : 'contain';
      saveSettings();
      applyClasses();
      toast(settings.fit === 'cover' ? '埋める（トリミング）' : '全体表示');
      break;
    case 'p': case 'P':
      settings.portraitOnly = !settings.portraitOnly;
      saveSettings();
      toast(`縦長画像のみ ${settings.portraitOnly ? 'ON' : 'OFF'}`);
      break;
    case 'g': case 'G':
      settings.gap = !settings.gap;
      saveSettings();
      applyClasses();
      break;
    case 'i': case 'I':
      settings.info = !settings.info;
      saveSettings();
      applyClasses();
      break;
    case '+': case '=': case ';': changeInterval(1); break;
    case '-': changeInterval(-1); break;
    case 'f': case 'F':
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
      break;
    case 'o': case 'O': openFolder(); break;
    case 'h': case 'H': case '?': help.classList.toggle('show'); break;
    case 'Escape':
      // フルスクリーン中の Esc はブラウザが解除に使うので、ここには届かない
      if (help.classList.contains('show')) help.classList.remove('show');
      else backToStart();
      break;
  }
});
$('help').addEventListener('click', () => $('help').classList.remove('show'));
</script>
</body>
</html>
